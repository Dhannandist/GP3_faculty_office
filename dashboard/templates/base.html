{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANGRANGO 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div id="wrapper">
        <div id="sidebar-wrapper">
            <div class="sidebar-heading">
                <i class="fas fa-hotel me-2"></i>
                PANGRANGO 3
            </div>
            <div class="list-group list-group-flush flex-grow-1">
                <a href="{% url 'dashboard' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-th-large me-2"></i> Dashboard
                </a>
                <a href="{% url 'reservasi' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'reservasi' %}active{% endif %}">
                    <i class="fas fa-file-alt me-2"></i> Reservasi
                </a>
                <a href="{% url 'payments' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'payments' %}active{% endif %}">
                    <i class="fas fa-money-bill me-2"></i> Payments
                </a>
                <a href="{% url 'reports' %}" class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'reports' %}active{% endif %}">
                    <i class="fas fa-chart-bar me-2"></i> Reports
                </a>
            </div>

            {% if user.role == "ADMIN" %}
            <div class="mt-auto p-3 small border-top border-secondary ">
              <a href="/admin/" class="text-white text-decoration-none">
                <i class="fa-regular fa-user me-2 "></i>Administration
              </a>
            </div>
            {% endif %}

            <div class="mt-auto p-3 border-top border-secondary small">
                <a href="{% url 'logout' %}" class="text-white text-decoration-none">
                    <i class="fas fa-sign-out-alt me-2"></i> Log Out
                </a>
            </div>
        </div>

        <div id="page-content-wrapper" class="w-100 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
